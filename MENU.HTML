<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFINITY RESTAURANT</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    /* Beautiful restaurant interior background */
    background-image: url('https://unsplash.com');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Semi-transparent overlay to ensure text is fully legible */
.overlay {
    background-color: rgba(255, 255, 255, 0.92);
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}

h1 {
    text-align: center;
    color: darkred;
    font-size: 32px;
    margin-bottom: 30px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
}

.main-container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    max-width: 1300px;
    margin: 0 auto;
}

.menu-section {
    flex: 3;
    min-width: 320px;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: flex-start;
}

.card {
    width: 220px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

img {
    width: 100%;
    height: 140px;
    border-radius: 8px;
    object-fit: cover;
}

h3 {
    margin: 12px 0 6px 0;
    font-size: 18px;
}

.price {
    font-weight: bold;
    color: #333;
    margin-bottom: 12px;
}

button {
    background: green;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
}

button:hover {
    background: darkgreen;
}

/* Sidebar layout for the cart */
.cart-section {
    flex: 1;
    min-width: 300px;
}

#cart {
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: sticky;
    top: 20px;
}

#cart h2 {
    margin-top: 0;
    border-bottom: 2px solid #f2f2f2;
    padding-bottom: 10px;
}

#items {
    list-style: none;
    padding: 0;
    margin: 15px 0;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 15px;
}

.qty-btn {
    background: #f2f2f2;
    color: #333;
    border: 1px solid #ccc;
    padding: 2px 8px;
    margin: 0 2px;
    border-radius: 3px;
    cursor: pointer;
    display: inline-block;
    width: auto;
    font-size: 12px;
}

.qty-btn:hover {
    background: #ddd;
}

.checkout-btn {
    background: #ff9900;
    margin-top: 15px;
}

.checkout-btn:hover {
    background: #e68a00;
}
</style>

<script>
let cart = [];

function addToCart(itemName, price) {
    let existingItem = cart.find(item => item.name === itemName);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({ name: itemName, price: price, quantity: 1 });
    }
    updateCartUI();
}

function updateQuantity(itemName, change) {
    let item = cart.find(item => item.name === itemName);
    if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
            cart = cart.filter(item => item.name !== itemName);
        }
    }
    updateCartUI();
}

function updateCartUI() {
    let list = document.getElementById("items");
    list.innerHTML = ""; 
    let total = 0;
    
    if (cart.length === 0) {
        list.innerHTML = "<li style='color: #888;'>Your cart is empty.</li>";
    } else {
        cart.forEach(item => {
            let itemTotal = item.price * item.quantity;
            total += itemTotal;
            
            let li = document.createElement("li");
            li.className = "cart-item";
            li.innerHTML = `
                <div>
                    <strong>${item.name}</strong><br>
                    <small>₹${item.price} x ${item.quantity}</small>
                </div>
                <div>
                    <span style="margin-right: 10px; font-weight: bold;">₹${itemTotal}</span>
                    <button class="qty-btn" onclick="updateQuantity('${item.name}', 1)">+</button>
                    <button class="qty-btn" onclick="updateQuantity('${item.name}', -1)" style="background: #ffdddd; color: red;">-</button>
                </div>
            `;
            list.appendChild(li);
        });
    }
    document.getElementById("total").innerHTML = "₹" + total;
}

function placeOrder() {
    if (cart.length === 0) {
        alert("Please add items to your cart before ordering!");
        return;
    }
    alert("Thank you! Your order has been registered at INFINITY RESTAURANT.");
    cart = [];
    updateCartUI();
}
</script>
</head>

<body>
<div class="overlay">
    <h1>🍽️ INFINITY RESTAURANT 🍽️</h1>

    <div class="main-container">
        <!-- Menu Layout -->
        <div class="menu-section">
            <div class="menu">

                <div class="card">
                <img src="https://unsplash.com" alt="Fresh Juice">
                <h3>Fresh Juice</h3>
                <p class="price">₹80</p>
                <button onclick="addToCart('Fresh Juice',80)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="French Fries">
                <h3>French Fries</h3>
                <p class="price">₹120</p>
                <button onclick="addToCart('French Fries',120)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Fried Rice">
                <h3>Fried Rice</h3>
                <p class="price">₹180</p>
                <button onclick="addToCart('Fried Rice',180)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Chicken Pasta">
                <h3>Chicken Pasta</h3>
                <p class="price">₹220</p>
                <button onclick="addToCart('Chicken Pasta',220)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Veg Sandwich">
                <h3>Veg Sandwich</h3>
                <p class="price">₹100</p>
                <button onclick="addToCart('Veg Sandwich',100)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Chocolate Milkshake">
                <h3>Chocolate Milkshake</h3>
                <p class="price">₹150</p>
                <button onclick="addToCart('Chocolate Milkshake',150)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Cold Coffee">
                <h3>Cold Coffee</h3>
                <p class="price">₹120</p>
                <button onclick="addToCart('Cold Coffee',120)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Vanilla Ice Cream">
                <h3>Vanilla Ice Cream</h3>
                <p class="price">₹90</p>
                <button onclick="addToCart('Vanilla Ice Cream',90)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Chicken 65">
                <h3>Chicken 65</h3>
                <p class="price">₹250</p>
                <button onclick="addToCart('Chicken 65',250)">Add to Cart</button>
                </div>

                <div class="card">
                <img src="https://unsplash.com" alt="Hakka Noodles">
                <h3>Hakka Noodles</h3>
                <p class="price">₹190</p>
                <button onclick="addToCart('Hakka Noodles',190)">Add to Cart</button>
                </div>

            </div>
        </div>

        <!-- Sidebar Cart -->
        <div class="cart-section">
            <div id="cart">
                <h2>🛒 Your Cart</h2>
                <ul id="items">
                    <li style="color: #888;">Your cart is empty.</li>
                </ul>
                <h3 style="border-top: 2px solid #f2f2f2; padding-top: 15px; margin-bottom: 5px; display: flex; justify-content: space-between;">
                    <span>Total:</span>
                    <span id="total">₹0</span>
                </h3>
                <button class="checkout-btn" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
